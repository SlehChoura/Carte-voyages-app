name: Fabriquer l'app iPhone (.ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire la page de la carte
        run: npm run build:web

      - name: Créer le projet iOS
        run: npx cap add ios

      - name: Autorisation Photos et nom de l'app (Info.plist)
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Pour placer vos photos sur la carte des voyages, l’application lit la date et le lieu de chaque photo. Rien ne quitte votre iPhone.'" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Nos voyages'" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Nos voyages'" "$PL"
          /usr/libexec/PlistBuddy -c "Print" "$PL"

      - name: Synchroniser la page et le module Photos
        run: |
          npx cap sync ios
          cat ios/App/CapApp-SPM/Package.swift
          cat ios/App/App/capacitor.config.json

      - name: Compiler (sans signature, Sideloadly signera)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 80
          test -d build/App.xcarchive/Products/Applications/App.app

      - name: Emballer le .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          ls -la build/Payload/App.app build/Payload/App.app/public
          plutil -p build/Payload/App.app/Info.plist | grep -E "NSPhotoLibrary|DisplayName"
          ls build/Payload/App.app/Frameworks; strings build/Payload/App.app/App | grep -m3 GaleriePhotos
          cd build && zip -qry NosVoyages.ipa Payload && ls -lh NosVoyages.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NosVoyages-ipa
          path: build/NosVoyages.ipa
          retention-days: 30
